<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;700&family=IBM+Plex+Sans:wght@300;400;700&display=swap');
    :root {
      --elev-0: 13%; --elev-1: 16%; --elev-2: 19%;
      --surface-chroma: 0.012; --surface-hue: 215;
      --surface-paper: oklch(var(--elev-0) var(--surface-chroma) var(--surface-hue));
      --surface-panel: oklch(var(--elev-1) var(--surface-chroma) var(--surface-hue));
      --surface-raised: oklch(var(--elev-2) var(--surface-chroma) var(--surface-hue));
      --border-hairline: oklch(27% 0.014 var(--surface-hue));
      --ink-text: oklch(92% 0.01 var(--surface-hue));
      --ink-dim: oklch(68% 0.014 var(--surface-hue));
      --color-accent: oklch(68% 0.16 var(--surface-hue));
      --status-success: oklch(72% 0.15 150);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --font-sans: "IBM Plex Sans", "IBM Plex Sans KR", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "IBM Plex Sans KR", ui-monospace, monospace;
      --font-size-2xs: 0.6875rem; --font-size-xs: 0.75rem; --font-size-sm: 0.8125rem; --font-size-lg: 1.25rem;
      --font-weight-light: 300; --font-weight-regular: 400; --font-weight-bold: 700;
      --radius-sm: 0.25rem; --radius-md: 0.5rem;
    }
    body { margin: 0; background: var(--surface-paper); color: var(--ink-text); font-family: var(--font-sans); font-weight: var(--font-weight-light); }
    .mono { font-family: var(--font-mono); }
    table { border-collapse: collapse; }
    th, td { border: 1px solid var(--border-hairline); padding: var(--space-2) var(--space-3); text-align: left; font-size: var(--font-size-xs); color: var(--ink-dim); }
    thead th { color: var(--ink-text); }
  </style>
</helmet>
<div style="width:1440px; height:900px; background:var(--surface-paper); display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-hairline); background:var(--surface-panel); padding:var(--space-2) var(--space-4);">
    <div class="mono" style="font-size:var(--font-size-sm); color:var(--ink-text);">crew-app</div>
    <div style="display:flex; gap:var(--space-4);">
      <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-dim);">보드</div>
      <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-dim);">DAG</div>
      <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-dim);">타임라인</div>
      <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-dim);">승인함</div>
      <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-text); border-bottom:2px solid var(--color-accent); padding-bottom:2px;">아티팩트</div>
    </div>
  </div>

  <div style="flex:1; min-height:0; display:flex;">
    <div style="width:240px; flex-shrink:0; background:var(--surface-panel); border-right:1px solid var(--border-hairline);"></div>

    <!-- artifacts body: requirement coverage matrix -->
    <div style="flex:1; min-width:0; padding:var(--space-4); box-sizing:border-box; display:flex; flex-direction:column; gap:var(--space-3); overflow:auto;">
      <div style="font-size:var(--font-size-lg); font-weight:var(--font-weight-bold);">아티팩트 — 요구사항 커버리지</div>
      <table>
        <thead>
          <tr>
            <th>요구사항</th>
            <sc-for list="{{artifactCols}}" as="a" hint-placeholder-count="4">
              <th>{{a}}</th>
            </sc-for>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
            <tr>
              <td style="color:var(--ink-text);">{{row.req}}</td>
              <sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="4">
                <td style="background:{{cell.bg}}; min-width:2.4rem;"></td>
              </sc-for>
            </tr>
          </sc-for>
        </tbody>
      </table>
      <div style="display:flex; gap:var(--space-4); font-size:var(--font-size-2xs); color:var(--ink-dim);">
        <div style="display:flex; align-items:center; gap:var(--space-2);"><span style="width:12px; height:12px; background:var(--status-success); display:inline-block; border-radius:var(--radius-sm);"></span>커버됨</div>
        <div style="display:flex; align-items:center; gap:var(--space-2);"><span style="width:12px; height:12px; background:var(--surface-raised); border:1px solid var(--border-hairline); display:inline-block; border-radius:var(--radius-sm);"></span>예상됨</div>
        <div style="display:flex; align-items:center; gap:var(--space-2);"><span style="width:12px; height:12px; background:transparent; border:1px solid var(--border-hairline); display:inline-block; border-radius:var(--radius-sm);"></span>없음</div>
      </div>
    </div>

    <div style="width:360px; flex-shrink:0; background:var(--surface-panel); border-left:1px solid var(--border-hairline);"></div>
  </div>
</div>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      artifactCols: ["login.spec.ts", "board.spec.ts", "dag.spec.ts", "inbox.spec.ts"],
      rows: [
        { req: "로그인 폼 접근성", cells: [
          { bg: "var(--status-success)" }, { bg: "var(--surface-raised)" }, { bg: "transparent" }, { bg: "transparent" },
        ]},
        { req: "보드 드래그 앤 드롭", cells: [
          { bg: "transparent" }, { bg: "var(--status-success)" }, { bg: "transparent" }, { bg: "transparent" },
        ]},
        { req: "DAG 임계 경로 표시", cells: [
          { bg: "transparent" }, { bg: "transparent" }, { bg: "var(--status-success)" }, { bg: "transparent" },
        ]},
        { req: "승인 반려 사유 기록", cells: [
          { bg: "transparent" }, { bg: "transparent" }, { bg: "transparent" }, { bg: "var(--surface-raised)" },
        ]},
      ],
    };
  }
}
</script>
</x-dc>
</body>
</html>
