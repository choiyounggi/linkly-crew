<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;700&family=IBM+Plex+Sans:wght@300;400;700&display=swap');
    :root {
      --elev-0: 13%; --elev-1: 16%; --elev-2: 19%; --elev-3: 22%;
      --surface-chroma: 0.012; --surface-hue: 215;
      --surface-paper: oklch(var(--elev-0) var(--surface-chroma) var(--surface-hue));
      --surface-panel: oklch(var(--elev-1) var(--surface-chroma) var(--surface-hue));
      --surface-raised: oklch(var(--elev-2) var(--surface-chroma) var(--surface-hue));
      --border-hairline: oklch(27% 0.014 var(--surface-hue));
      --ink-text: oklch(92% 0.01 var(--surface-hue));
      --ink-dim: oklch(68% 0.014 var(--surface-hue));
      --ink-faint: oklch(50% 0.014 var(--surface-hue));
      --color-accent: oklch(68% 0.16 var(--surface-hue));
      --color-accent-ink: oklch(14% 0.02 var(--surface-hue));
      --status-danger: oklch(66% 0.19 25);
      --status-warning: oklch(76% 0.15 80);
      --status-success: oklch(72% 0.15 150);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-6: 1.5rem;
      --font-sans: "IBM Plex Sans", "IBM Plex Sans KR", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "IBM Plex Sans KR", ui-monospace, monospace;
      --font-size-2xs: 0.6875rem; --font-size-xs: 0.75rem; --font-size-sm: 0.8125rem; --font-size-lg: 1.25rem;
      --font-weight-light: 300; --font-weight-regular: 400; --font-weight-bold: 700;
      --radius: 0.5rem; --radius-xs: calc(var(--radius) * 0.25); --radius-sm: calc(var(--radius) * 0.5); --radius-md: var(--radius); --radius-circle: 9999px;
    }
    body { margin: 0; background: var(--surface-paper); color: var(--ink-text); font-family: var(--font-sans); font-weight: var(--font-weight-light); }
    .mono { font-family: var(--font-mono); }
  </style>
</helmet>
<div style="width:1440px; height:900px; background:var(--surface-paper); display:flex; flex-direction:column;">

  <!-- compact chrome -->
  <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border-hairline); background:var(--surface-panel); padding:var(--space-2) var(--space-4);">
    <div class="mono" style="font-size:var(--font-size-sm); color:var(--ink-text);">crew-app</div>
    <div style="display:flex; gap:var(--space-4);">
      <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-text); border-bottom:2px solid var(--color-accent); padding-bottom:2px;">보드</div>
      <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-dim);">DAG</div>
      <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-dim);">타임라인</div>
      <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-dim);">승인함</div>
      <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-dim);">아티팩트</div>
    </div>
  </div>

  <div style="flex:1; min-height:0; display:flex;">
    <!-- rail (condensed) -->
    <div style="width:240px; flex-shrink:0; background:var(--surface-panel); border-right:1px solid var(--border-hairline); padding:var(--space-2); box-sizing:border-box; display:flex; flex-direction:column; gap:var(--space-2);">
      <sc-for list="{{rail}}" as="r" hint-placeholder-count="4">
        <div style="display:flex; align-items:center; gap:var(--space-2); background:var(--surface-raised); border:1px solid var(--border-hairline); border-radius:var(--radius-md); padding:var(--space-2) var(--space-3);">
          <div style="width:6px; height:6px; border-radius:var(--radius-circle); background:{{r.dot}};"></div>
          <div class="mono" style="font-size:var(--font-size-xs); color:var(--ink-text);">{{r.name}}</div>
        </div>
      </sc-for>
    </div>

    <!-- board: 5-column kanban, hi-fi -->
    <div style="flex:1; min-width:0; padding:var(--space-4); box-sizing:border-box; display:flex; flex-direction:column; gap:var(--space-3);">
      <div style="font-size:var(--font-size-lg); font-weight:var(--font-weight-bold); color:var(--ink-text);">보드</div>
      <div style="flex:1; display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:var(--space-3);">
        <sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
          <div style="display:flex; flex-direction:column; gap:var(--space-2); background:var(--surface-panel); border-radius:var(--radius-md); padding:var(--space-2);">
            <div class="mono" style="display:flex; justify-content:space-between; font-size:var(--font-size-2xs); text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim); padding:0 var(--space-1);">
              <span>{{c.name}}</span><span>{{c.count}}</span>
            </div>
            <sc-for list="{{c.items}}" as="it" hint-placeholder-count="2">
              <div style="background:var(--surface-raised); border:1px solid var(--border-hairline); border-radius:var(--radius-sm); padding:var(--space-2) var(--space-3); display:flex; flex-direction:column; gap:var(--space-1);">
                <div style="font-size:var(--font-size-sm); font-weight:var(--font-weight-regular); color:var(--ink-text); line-height:1.35;">{{it.title}}</div>
                <div class="mono" style="font-size:var(--font-size-2xs); color:var(--ink-dim);">{{it.tag}} · {{it.owner}}</div>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- right (condensed thread) -->
    <div style="width:360px; flex-shrink:0; background:var(--surface-panel); border-left:1px solid var(--border-hairline); padding:var(--space-2); box-sizing:border-box;">
      <div class="mono" style="font-size:var(--font-size-2xs); text-transform:uppercase; color:var(--ink-dim); margin-bottom:var(--space-2);">스레드</div>
      <div style="background:var(--surface-raised); border:1px solid var(--border-hairline); border-radius:var(--radius-md); padding:var(--space-2) var(--space-3);">
        <div class="mono" style="font-size:var(--font-size-2xs); color:var(--ink-dim);">빌드-02</div>
        <div style="font-size:var(--font-size-sm); color:var(--ink-text);">테스트 통과, 배포 대기열 등록</div>
      </div>
    </div>
  </div>
</div>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rail: [
        { name: "리서치-01", dot: "var(--status-success)" },
        { name: "빌드-02", dot: "var(--status-success)" },
        { name: "리뷰-01", dot: "var(--status-warning)" },
        { name: "테스트-03", dot: "var(--status-danger)" },
      ],
      cols: [
        { name: "대기", count: 3, items: [
          { title: "로그인 폼 접근성 점검", tag: "T-114", owner: "리서치-01" },
          { title: "DAG 뷰 줌 성능", tag: "T-118", owner: "빌드-02" },
        ]},
        { name: "진행", count: 4, items: [
          { title: "토큰 스케일 정의", tag: "T-101", owner: "빌드-02" },
          { title: "프리미티브 Button 구현", tag: "T-102", owner: "빌드-02" },
        ]},
        { name: "검토", count: 2, items: [
          { title: "타임라인 스크롤 튐 원인", tag: "T-096", owner: "리뷰-01" },
        ]},
        { name: "승인 대기", count: 2, items: [
          { title: "프로덕션 배포 승인", tag: "T-090", owner: "배포-01" },
        ]},
        { name: "완료", count: 5, items: [
          { title: "rail 카드 상태 표시", tag: "T-080", owner: "빌드-02" },
        ]},
      ],
    };
  }
}
</script>
</x-dc>
</body>
</html>
