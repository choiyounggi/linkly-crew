[package]
name = "crew-app"
version = "0.1.0"
description = "linkly-crew desktop app shell"
edition = "2021"

[lib]
name = "crew_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
# path-deps into the root workspace's crates (contracts-m4.md §C6): this
# crate stays standalone (see the empty [workspace] below) but still
# consumes crew-run's public API plus the two upstream types it re-exports
# by reference only (crew_proto::Role for RunMode::Scripted's
# planted_violations, crew_lead::accept::AcceptanceLoop::default_budget()
# for RunConfig.max_rework) — neither crate is modified.
crew-run = { path = "../../../crates/crew-run" }
crew-proto = { path = "../../../crates/crew-proto" }
crew-lead = { path = "../../../crates/crew-lead" }

# standalone (contracts-m4.md §C4): this crate is NOT a member of the root
# workspace. An empty [workspace] table here stops Cargo's upward member
# search, so it never joins /Cargo.toml (owned by t-run).
[workspace]
