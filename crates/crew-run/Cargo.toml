[package]
name = "crew-run"
version = "0.1.0"
edition = "2021"

[dependencies]
crew-proto = { path = "../crew-proto" }
crew-bus = { path = "../crew-bus" }
crew-agent = { path = "../crew-agent" }
crew-lead = { path = "../crew-lead" }
crew-ledger = { path = "../crew-ledger" }
crew-harness = { path = "../crew-harness" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
# t1-msg-race r2 review F1: a second raw connection to the same file-backed
# ledger, used only to deterministically force messages_since's Err path in
# a test (drop its table out from under the ledger's own connection).
rusqlite = { version = "0.32", features = ["bundled"] }
